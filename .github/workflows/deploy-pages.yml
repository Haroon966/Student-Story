# Build and deploy the Vite app to GitHub Pages.
# Repo settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compute VITE_BASE_PATH
        id: base
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          expected="${owner_lc}.github.io"
          actual_lc="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          if [ "$actual_lc" = "$expected" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "Using root base path (user/org GitHub Pages site)."
          else
            echo "path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "Using project base path /${REPO_NAME}/"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
